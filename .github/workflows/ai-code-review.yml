name: Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gemini PR Review
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: 'gemini-2.5-flash-lite'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Kamu adalah code reviewer. Review pull request #${{ github.event.pull_request.number }}
            di repository ${{ github.repository }}.
            Gunakan `gh pr diff` untuk melihat perubahan.
            Fokus pada bug, masalah keamanan, performa, dan keterbacaan kode.
            Berikan hasil review ringkas dalam bahasa Indonesia, lalu posting
            sebagai komentar PR dengan `gh pr comment`.