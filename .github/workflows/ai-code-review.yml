name: Automated Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ambil diff PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Gemini PR Review
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: 'gemini-3.5-flash-lite'
          prompt: |
            Kamu adalah code reviewer. Baca file pr.diff di root repository.
            Fokus pada bug, masalah keamanan, performa, dan keterbacaan kode.
            Tulis review ringkas dalam bahasa Indonesia.
            Jawab HANYA dengan teks review. Jangan menjalankan perintah apa pun
            dan jangan memposting komentar sendiri.

      - name: Posting komentar review
        if: steps.gemini.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW: ${{ steps.gemini.outputs.summary }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## Review Otomatis (Gemini)

          $REVIEW"